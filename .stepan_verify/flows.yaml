# Карта флоу проекта (stepan_verify): фичи → пути пользователя → доказательства.
# Агенты: читайте как общий словарь продукта; правки предлагайте через отчёт «Изменения».
version: 1
project: Stepan (stepan_verify)
areas:
- id: dashboard
  title: Дашборд («Пульт»)
- id: sessions
  title: Сессии агентов
- id: changes
  title: Изменения («Карта»)
- id: tasks
  title: Задачи (доска)
- id: docs
  title: Документы («Полка»)
- id: skills
  title: Скиллы («Связи»)
- id: flows
  title: Флоу (карта пользовательских путей)
- id: app
  title: 'Приложение: настройки, обновления, запуск'
features:
- id: dashboard.overview
  title: Дашборд со сводкой и списком сессий
  area: dashboard
  summary: Главный экран — метрики (сессий за 24 ч, задач в работе, ждут тебя, проектов) и список недавних сессий по проектам
  aliases:
  - главный экран
  - пульт
  - дашборд
  - домашний экран
  paths:
  - id: open
    title: Открыть приложение или нажать «Дашборд» в сайдбаре
    steps:
    - id: sidebar
      screen: Левый сайдбар
      action: Нажать «Дашборд»
      result: Открывается сводка метрик и список недавних сессий, сгруппированных по проектам
      entities:
      - AppView::nav_item
      - Page::Dashboard
      - dashboard::render
      files:
      - crates/stepan_verify_app/src/app.rs
      - crates/stepan_verify_app/src/dashboard.rs
    - id: refresh
      screen: Дашборд
      action: Нажать «Обновить»
      result: Кнопка показывает «Сканирую…», список сессий пересобирается с диска
      entities:
      - dashboard::render
      - SessionIndex scan
      files:
      - crates/stepan_verify_app/src/dashboard.rs
      - crates/stepan_verify_core/src/sessions.rs
  proofs: []
- id: dashboard.live-cards
  title: Живые карточки сессий («Пульт»)
  area: dashboard
  summary: Карточка работающей сессии показывает шаги плана, текущий шаг, «Шаг N из M», статус «ждёт подтверждения / ответа»
  aliases:
  - пульт
  - живая карточка
  - блок «Сейчас»
  - карточка агента
  paths:
  - id: watch
    title: Следить за агентом с дашборда
    steps:
    - id: card
      screen: Дашборд
      action: Запустить или продолжить сессию и вернуться на дашборд
      result: Карточка сессии со шагами, текущим действием и прогрессом «Шаг N из M»
      entities:
      - LiveSession
      - live_card::Card
      - dashboard::live_card
      files:
      - crates/stepan_verify_app/src/live_card.rs
      - crates/stepan_verify_app/src/dashboard.rs
    - id: external
      screen: Дашборд
      action: Запустить агента вне Stepan (терминал, Codex Desktop)
      result: Появляется карточка с плашкой «ВНЕ STEPAN» и статусом «Работает» / «Ждёт тебя», собранная по хвосту файла сессии
      entities:
      - ExternalLive
      - agents::peek
      files:
      - crates/stepan_verify_agents/src/peek.rs
      - crates/stepan_verify_app/src/app.rs
  - id: decide
    title: Решить прямо на карточке
    steps:
    - id: approve
      screen: Карточка сессии
      action: Нажать «Разрешить» или «Отклонить» на запросе подтверждения
      result: Агент продолжает или получает отказ без открытия сессии
      entities:
      - dashboard::live_card
      - AppView::decide
      files:
      - crates/stepan_verify_app/src/dashboard.rs
      - crates/stepan_verify_app/src/app.rs
    - id: answer
      screen: Карточка сессии
      action: Ввести ответ в поле и нажать «Отправить»
      result: Ответ уходит в сессию агента
      entities:
      - dashboard::live_card
      files:
      - crates/stepan_verify_app/src/dashboard.rs
    - id: pause
      screen: Карточка сессии
      action: Нажать «Пауза»
      result: Текущий ход агента останавливается
      entities:
      - AppView::pause_session
      files:
      - crates/stepan_verify_app/src/app.rs
      - crates/stepan_verify_app/src/dashboard.rs
  proofs:
  - kind: test
    title: Окно шагов вокруг текущего, прогресс «Шаг N из M»
    reference: crates/stepan_verify_app/src/live_card.rs
    covers:
    - card
    at: 2026-11-25T08:41:08.802161Z
  - kind: test
    title: Чтение хвоста файла внешней сессии
    reference: crates/stepan_verify_agents/src/peek.rs
    covers:
    - external
    at: 2026-11-25T08:41:08.802161Z
- id: dashboard.notifications
  title: Уведомления «закончил / ждёт подтверждения»
  area: dashboard
  summary: Когда агент закончил или ждёт подтверждения, а ты не смотришь на сессию, приходит тост и уведомление macOS
  aliases:
  - тосты
  - уведомления
  - нотификации
  paths:
  - id: background
    title: Агент закончил в фоне
    steps:
    - id: toast
      screen: Любой экран (окно не на этой сессии)
      action: Дождаться завершения хода или запроса подтверждения
      result: Показывается тост / уведомление macOS
      entities:
      - AppView::on_session_event
      - is_window_active
      files:
      - crates/stepan_verify_app/src/app.rs
  proofs: []
- id: dashboard.archive
  title: Архив сессий
  area: dashboard
  summary: Скрыть старую сессию с дашборда в архив и вернуться к ней через «Архив»
  aliases:
  - скрыть сессию
  - архив
  paths:
  - id: archive
    title: В архив и обратно
    steps:
    - id: hide
      screen: Дашборд, список «Недавние»
      action: Нажать значок «В архив» у сессии
      result: Сессия пропадает из «Недавние»
      entities:
      - Archive
      - dashboard::render
      files:
      - crates/stepan_verify_core/src/archive.rs
      - crates/stepan_verify_app/src/dashboard.rs
    - id: view
      screen: Дашборд
      action: Нажать «Архив · N»
      result: Заголовок меняется на «Архив», видны скрытые сессии; кнопка «К недавним» возвращает
      entities:
      - dash-archive-view
      files:
      - crates/stepan_verify_app/src/dashboard.rs
  proofs:
  - kind: test
    title: Архив сохраняется и читается
    reference: crates/stepan_verify_core/src/archive.rs
    covers:
    - hide
    at: 2026-11-25T08:41:08.802161Z
- id: sessions.new
  title: Новая сессия
  area: sessions
  summary: Запуск Claude Code или Codex на проекте с первой задачей, вложениями и скриншотом
  aliases:
  - запустить агента
  - новый агент
  - новая сессия Claude
  paths:
  - id: dialog
    title: Через диалог «Новая сессия»
    steps:
    - id: open
      screen: Дашборд / сайдбар
      action: Нажать «Новая сессия»
      result: Открывается диалог с полями «Проект», «Агент», «Задача»
      entities:
      - NewSessionDialog
      - ProjectPicker
      files:
      - crates/stepan_verify_app/src/new_session.rs
      - crates/stepan_verify_app/src/project_picker.rs
    - id: pick-project
      screen: Диалог «Новая сессия»
      action: Выбрать недавний проект или «Другая папка…»
      result: Проект выбран, папка запоминается в недавних
      entities:
      - ProjectPicker
      files:
      - crates/stepan_verify_app/src/project_picker.rs
    - id: start
      screen: Диалог «Новая сессия»
      action: Выбрать Claude/Codex, написать задачу и нажать «Запустить» (или Enter)
      result: Открывается экран сессии, агент начинает работать
      entities:
      - AppView::start_session
      - SessionView::start
      files:
      - crates/stepan_verify_app/src/app.rs
      - crates/stepan_verify_app/src/session.rs
  - id: launch-args
    title: Из командной строки
    steps:
    - id: cli-start
      screen: Терминал
      action: Запустить stepan_verify --new / --start claude --cwd <папка> --send <текст>
      result: Приложение открывается сразу с диалогом или с запущенной сессией
      entities:
      - Launch::from_args
      files:
      - crates/stepan_verify_app/src/app.rs
  proofs: []
- id: sessions.resume
  title: Продолжить сессию из истории
  area: sessions
  summary: Открыть старую сессию Claude или Codex внутри приложения с историей и продолжить диалог
  aliases:
  - продолжить
  - открыть сессию
  - resume
  paths:
  - id: from-dashboard
    title: Из списка на дашборде
    steps:
    - id: open
      screen: Дашборд, «Недавние»
      action: Нажать «Открыть» у сессии
      result: Открывается экран сессии с загруженной историей (скелетоны пока грузится)
      entities:
      - AppView::open_session
      - SessionView::resume
      files:
      - crates/stepan_verify_app/src/app.rs
      - crates/stepan_verify_app/src/session.rs
      - crates/stepan_verify_app/src/loading.rs
  proofs: []
- id: sessions.chat
  title: Лента сессии и отправка сообщений
  area: sessions
  summary: Лента сообщений, инструментов и диффов; сообщение агенту во время хода; Enter — отправить, Shift+Enter — перенос, «Стоп»
  aliases:
  - чат с агентом
  - лента
  - экран сессии
  paths:
  - id: talk
    title: Написать агенту и остановить
    steps:
    - id: send
      screen: Экран сессии, вкладка чата
      action: Написать сообщение и нажать Enter или «Отправить»
      result: Сообщение попадает в ленту, агент стримит ответ («Думает…»)
      entities:
      - SessionView::send
      - AgentEvent
      files:
      - crates/stepan_verify_app/src/session.rs
      - crates/stepan_verify_agents/src/model.rs
    - id: tools
      screen: Лента сессии
      action: Смотреть на ход агента
      result: Подряд идущие инструменты сворачиваются в группу, правки показаны встроенным диффом +/−
      entities:
      - fold_runs
      - unified_diff
      files:
      - crates/stepan_verify_app/src/session.rs
      - crates/stepan_verify_agents/src/claude.rs
    - id: stop
      screen: Экран сессии
      action: Нажать «Стоп»
      result: Текущий ход прерывается
      entities:
      - SessionView::interrupt
      files:
      - crates/stepan_verify_app/src/session.rs
  proofs:
  - kind: test
    title: Группировка инструментов и склейка правок в ленте
    reference: crates/stepan_verify_app/src/session.rs
    covers:
    - tools
    at: 2026-11-25T08:41:08.802161Z
  - kind: test
    title: Правка превращается в unified diff (Claude)
    reference: crates/stepan_verify_agents/src/claude.rs
    covers:
    - tools
    at: 2026-11-25T08:41:08.802161Z
- id: sessions.approvals
  title: Подтверждения действий агента
  area: sessions
  summary: Агент просит разрешение на команду или правку; пользователь нажимает «Разрешить» или «Отклонить»
  aliases:
  - апрув
  - разрешить
  - permission prompt
  paths:
  - id: in-session
    title: В экране сессии
    steps:
    - id: prompt
      screen: Экран сессии
      action: Агент запрашивает разрешение
      result: В ленте появляется запрос с кнопками «Разрешить» и «Отклонить»
      entities:
      - SessionView
      - can_use_tool
      - requestApproval
      files:
      - crates/stepan_verify_app/src/session.rs
      - crates/stepan_verify_agents/src/claude.rs
      - crates/stepan_verify_agents/src/codex.rs
    - id: decide
      screen: Экран сессии
      action: Нажать «Разрешить» или «Отклонить»
      result: Агент продолжает работу или получает отказ
      entities:
      - SessionView::decide
      files:
      - crates/stepan_verify_app/src/session.rs
  proofs: []
- id: sessions.attachments
  title: 'Вложения: картинки, файлы, скриншот области'
  area: sessions
  summary: Прикрепить картинку или файл кнопкой, вставкой Cmd+V или перетаскиванием; снимок экрана ⌘⇧2; упоминание файлов через @
  aliases:
  - скриншот
  - прикрепить
  - вставить картинку
  - drag and drop
  - '@файл'
  paths:
  - id: attach
    title: Прикрепить к сообщению
    steps:
    - id: pick
      screen: Поле ввода сессии / диалог «Новая сессия» / «Новая задача»
      action: Нажать «Прикрепить», вставить Cmd+V или перетащить файл в окно
      result: Под полем появляется превью вложения с кнопкой «Убрать»
      entities:
      - attach::tray
      - AttachTray
      files:
      - crates/stepan_verify_app/src/attach.rs
    - id: screenshot
      screen: Поле ввода
      action: Нажать «Снимок экрана» или ⌘⇧2 и выделить область
      result: Скриншот добавляется как вложение; Esc отменяет
      entities:
      - TakeScreenshot
      files:
      - crates/stepan_verify_app/src/attach.rs
  proofs:
  - kind: test
    title: Лоток вложений и команда скриншота
    reference: crates/stepan_verify_app/src/attach.rs
    covers:
    - pick
    - screenshot
    at: 2026-11-25T08:41:08.802161Z
  - kind: test
    title: Картинки уходят агенту как base64
    reference: crates/stepan_verify_agents/src/claude.rs
    covers:
    - pick
    at: 2026-11-25T08:41:08.802161Z
- id: sessions.preview
  title: Превью файлов справа
  area: sessions
  summary: Файл из ленты открывается в панели справа — HTML в WKWebView, код с подсветкой, markdown, картинки, папки
  aliases:
  - правая панель
  - превью
  - просмотр файла
  paths:
  - id: from-feed
    title: Открыть файл из ленты
    steps:
    - id: open
      screen: Лента сессии
      action: Нажать «Открыть» у файла или картинки
      result: Справа открывается панель превью с кнопками «Назад», «Открыть в системе», «Показать в Finder», «Закрыть»
      entities:
      - PreviewView
      - AppView::open_preview
      files:
      - crates/stepan_verify_app/src/preview.rs
      - crates/stepan_verify_app/src/app.rs
  proofs:
  - kind: test
    title: Типы по расширению, бинарные и обрезанные файлы
    reference: crates/stepan_verify_app/src/preview.rs
    covers:
    - open
    at: 2026-11-25T08:41:08.802161Z
- id: sessions.tabs
  title: Открытые сессии в сайдбаре и закрытие
  area: sessions
  summary: Открытые сессии живут в сайдбаре как вкладки; переключение между ними, закрытие останавливает процесс агента
  aliases:
  - вкладки сессий
  - сайдбар сессий
  paths:
  - id: switch
    title: Переключиться и закрыть
    steps:
    - id: switch
      screen: Левый сайдбар
      action: Нажать на открытую сессию
      result: Показывается экран этой сессии
      entities:
      - Page::Session
      - AppView::show
      files:
      - crates/stepan_verify_app/src/app.rs
    - id: close
      screen: Экран сессии
      action: Нажать «Закрыть сессию»
      result: Процесс агента останавливается, открывается дашборд
      entities:
      - AppView::close_session
      files:
      - crates/stepan_verify_app/src/app.rs
      - crates/stepan_verify_app/src/session.rs
  proofs: []
- id: sessions.step-progress
  title: Прогресс плана агента («Шаг N из M»)
  area: sessions
  summary: В сессии виден план агента с отметкой текущего шага
  aliases:
  - план агента
  - шаги
  - чеклист
  paths:
  - id: view
    title: Смотреть план в сессии
    steps:
    - id: plan
      screen: Экран сессии
      action: Агент ведёт план задач
      result: Панель плана показывает «Шаг N из M» или «Готово N из M»
      entities:
      - session::plan_panel
      files:
      - crates/stepan_verify_app/src/session.rs
  proofs: []
- id: changes.report
  title: Вкладка «Изменения» — отчёт по сессии
  area: changes
  summary: Субагент читает сессию и собирает флоу-схему, что добавлено/изменено/удалено, было→стало, риски и что проверить
  aliases:
  - изменения
  - отчёт
  - ревью сессии
  - вкладка изменений
  paths:
  - id: build
    title: Собрать отчёт
    steps:
    - id: tab
      screen: Экран сессии
      action: Открыть вкладку «Изменения» и нажать «Собрать карту»
      result: Запускается сабагент-ревьюер, идёт прогресс «Читает сессию…»
      entities:
      - ChangesView
      - changes::runs
      - ChangesInput
      files:
      - crates/stepan_verify_app/src/changes/mod.rs
      - crates/stepan_verify_app/src/changes/runs.rs
      - crates/stepan_verify_app/src/session.rs
    - id: cancel
      screen: Вкладка «Изменения»
      action: Нажать «Отменить»
      result: Сборка прекращается
      entities:
      - ChangesView::cancel
      files:
      - crates/stepan_verify_app/src/changes/mod.rs
    - id: rebuild
      screen: Вкладка «Изменения»
      action: Нажать «Дополнить» или «Пересобрать»
      result: Отчёт обновляется по новым ходам сессии (батч-обновление)
      entities:
      - ChangesView
      - changes::runs
      files:
      - crates/stepan_verify_app/src/changes/mod.rs
      - crates/stepan_verify_app/src/changes/runs.rs
  proofs: []
- id: changes.map
  title: Карта функций «было / стало / разница»
  area: changes
  summary: 'Нативный граф-холст: узлы функций и DTO, рёбра вызовов, режимы было/стало/разница, итерации сессии'
  aliases:
  - карта
  - граф
  - холст
  - было стало
  - map
  paths:
  - id: explore
    title: Исследовать карту
    steps:
    - id: canvas
      screen: Вкладка «Изменения», «Карта»
      action: Тянуть холст, зумить, нажать «Вписать»
      result: Холст двигается и масштабируется; «Вписать» центрирует карту
      entities:
      - Canvas
      - zoom-fit
      files:
      - crates/stepan_verify_app/src/changes/canvas.rs
      - crates/stepan_verify_app/src/changes/mod.rs
    - id: node
      screen: Карта
      action: Нажать на узел
      result: Справа панель узла — сигнатура, дифф, сущности, «Что доказывает»
      entities:
      - Panel::Node
      - Panel::Dto
      - Panel::Group
      files:
      - crates/stepan_verify_app/src/changes/mod.rs
      - crates/stepan_verify_app/src/changes/map.rs
    - id: list
      screen: Карта
      action: Переключить на «Списком»
      result: Те же изменения списком вместо холста
      entities:
      - ChangesView
      files:
      - crates/stepan_verify_app/src/changes/mod.rs
  proofs:
  - kind: test
    title: 'Холст: зум, подгонка, перетаскивание'
    reference: crates/stepan_verify_app/src/changes/canvas.rs
    covers:
    - canvas
    at: 2026-11-25T08:41:08.802161Z
  - kind: test
    title: Раскладка карты, рёбра, итерации, сигнатуры
    reference: crates/stepan_verify_app/src/changes/map.rs
    covers:
    - node
    at: 2026-11-25T08:41:08.802161Z
- id: changes.checks
