feature: Открытые сессии в сайдбаре и закрытие
area: Сессии агентов
summary: Открытые сессии живут в сайдбаре как вкладки; переключение между ними, закрытие останавливает процесс агента
aliases: [вкладки сессий, сайдбар сессий]

paths:
  Переключиться и закрыть:
    - Левый сайдбар: Нажать на открытую сессию -> Показывается экран этой сессии  [Page::Session, AppView::show, crates/stepan_verify_app/src/app.rs]
    - Экран сессии: Нажать «Закрыть сессию» -> Процесс агента останавливается, открывается дашборд  [AppView::close_session, crates/stepan_verify_app/src/app.rs, crates/stepan_verify_app/src/session.rs]
