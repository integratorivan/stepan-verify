feature: Вкладки открытых сессий
area: Сессии агентов
status: done
summary: Открытые сессии лежат в сайдбаре как вкладки: переключаешься кликом, закрываешь крестиком — и агент останавливается
aliases: [вкладки сессий, открытые сессии, сайдбар сессий]
entries: [crates/stepan_verify_app/src/session.rs, crates/stepan_verify_app/src/app.rs]
starts_at: Левый сайдбар

paths:
  Переключение:
    - Левый сайдбар: кликнуть строку сессии в блоке «Открытые сессии» -> открылся Экран сессии этой вкладки, строка подсвечена как активная  [AppView::session_item, AppView::show, crates/stepan_verify_app/src/app.rs]
  Закрытие:
    - Левый сайдбар: навести на строку сессии и нажать крестик «Закрыть сессию» (появляется при наведении) -> вкладка пропадает из «Открытые сессии», процесс агента останавливается; если закрыта текущая сессия, открывается Дашборд  [AppView::close_session, AgentHandle::drop, crates/stepan_verify_app/src/app.rs, crates/stepan_verify_agents/src/lib.rs]
  Возврат после перезапуска:
    - Любой экран: открыть или закрыть сессию -> список вкладок и открытая страница сохраняются в хранилище → после запуска приложения вкладки открываются заново, с прошлым transcript, пока агент его перечитывает  [AppView::persist_workspace, AppView::restore_workspace, crates/stepan_verify_app/src/workspace.rs]
