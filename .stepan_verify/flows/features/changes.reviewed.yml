feature: Отметка «просмотрено» на узлах карты
area: Изменения («Карта»)
status: done
summary: Отмечаешь узлы, которые уже посмотрел; при новом прогоне неизменённые приглушаются, а изменившиеся подсвечиваются и помечаются «изменилось после просмотра»
aliases: [просмотрено, отметка, прочитано, приглушить, только новое, изменилось после просмотра, просмотренные узлы]
entries: [crates/stepan_verify_app/src/changes/reviewed.rs, crates/stepan_verify_app/src/changes/mod.rs]
starts_at: Карта

paths:
  Отметить:
    - Карта: навести курсор на карточку и нажать её значок отметки у заголовка (или «отметить просмотренным» в Панели узла) -> Узел получает значок «Просмотрено» и приглушается; в тулбаре растёт «просмотрено N из M»  [toggle_reviewed, Review::Seen, render_map_section, crates/stepan_verify_app/src/changes/mod.rs, crates/stepan_verify_app/src/changes/reviewed.rs]
    - Карта: нажать значок у отмеченной карточки или кнопку «просмотрено» в Панели узла -> Отметка снимается, узел снова яркий, счётчик уменьшается  [toggle_reviewed, Panel::Node, node-reviewed, crates/stepan_verify_app/src/changes/mod.rs]
  После нового прогона:
    - Карта, после нового прогона: посмотреть карту -> Просмотренные и неизменившиеся узлы приглушены (прозрачность 50%), пока не наведёшь курсор или не выберешь их; изменившиеся не приглушаются, на карточке акцентный значок, в тулбаре «изменилось после просмотра · N»  [refresh_review, Review::ChangedSince, opacity, crates/stepan_verify_app/src/changes/mod.rs]
    - Панель узла: у изменившегося узла нажать «просмотрено снова» -> Узел снова отмечен по текущей версии и приглушается; под заголовком пояснение, что узел изменился после просмотра  [render_node_panel, toggle_reviewed, crates/stepan_verify_app/src/changes/mod.rs]
  Только новое:
    - Карта: включить «Только новое» -> Просмотренные и неизменившиеся узлы убираются с холста; остаются новое и изменившееся  [only_new, Graph.hidden, crates/stepan_verify_app/src/changes/mod.rs, crates/stepan_verify_app/src/changes/map.rs]
    - Карта: все узлы просмотрены, включён «Только новое» -> Пустое состояние «Всё на карте просмотрено» и пояснение, что новое появится со следующим прогоном; кнопка «Показать всю карту» выключает фильтр  [render_map_section, map-show-all, crates/stepan_verify_app/src/changes/mod.rs]
  Хранение:
    - Карта: открыть сессию снова -> Отметки читаются из reviewed.json и применяются к текущему прогону; каждая новая отметка сразу записывается в файл  [reviewed::load, reviewed::save, refresh_review, crates/stepan_verify_app/src/changes/reviewed.rs, crates/stepan_verify_app/src/changes/mod.rs]

proofs:
  - test: crates/stepan_verify_app/src/changes/reviewed.rs::fingerprint_follows_the_code_not_the_wording  covers: 1, 3, 4
  - test: crates/stepan_verify_app/src/changes/reviewed.rs::marks_round_trip  covers: 7
