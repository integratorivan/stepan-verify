feature: Карта изменений сессии
area: Изменения («Карта»)
status: done
summary: Пользователь смотрит граф функций и DTO с вызовами и режимами «было», «стало» и «разница», по итерациям сессии
aliases: [карта, граф, холст, было стало, разница, карта изменений, map, граф изменений]
entries: [crates/stepan_verify_app/src/changes/map.rs, crates/stepan_verify_app/src/changes/canvas.rs, crates/stepan_verify_app/src/changes/mod.rs]
starts_at: Карта

paths:
  Холст:
    - Вкладка «Изменения»: открыть вкладку «Карта» -> Холст открывается на главном кадре в 100%: кадры по смыслу, карточки функций и типов, стрелки вызовов; при смене итерации масштаб подгоняется заново  [Lens::Map, canvas::View::readable, map::main_frame, crates/stepan_verify_app/src/changes/mod.rs, crates/stepan_verify_app/src/changes/canvas.rs]
    - Карта: тянуть холст мышью или средней кнопкой, колесо без модификатора -> Холст сдвигается; короткое движение без выхода за порог не двигает холст, чтобы клик по карточке работал  [drag_start, on_mouse_move, on_scroll, crates/stepan_verify_app/src/changes/mod.rs, crates/stepan_verify_app/src/changes/canvas.rs]
    - Карта: ⌘ / Ctrl + колесо, щипок или кнопки «−», «+» -> Масштаб меняется около курсора (колесо и щипок) или от центра (кнопки)  [on_scroll, on_pinch, zoom_center, zoom-out, zoom-in, crates/stepan_verify_app/src/changes/mod.rs, crates/stepan_verify_app/src/changes/canvas.rs]
    - Карта: нажать «Вписать» или двойной клик по холсту -> Вся карта вписывается в окно, но не увеличивается сверх 100%; кнопка с процентом возвращает 100% на главном функционале  [zoom-fit, fit, readable, crates/stepan_verify_app/src/changes/mod.rs, crates/stepan_verify_app/src/changes/canvas.rs]
    - Карта: навести курсор на карточку -> Карточка раскрывается: заголовок и описание полностью, пока курсор на ней  [hovered, expanded, crates/stepan_verify_app/src/changes/mod.rs]
  Режимы «Было», «Стало», «Разница»:
    - Карта: нажать «Было» -> Видно всё, кроме добавленного в этой сессии: старое состояние, удалённое и изменённое  [MapMode::Before, status_visible, crates/stepan_verify_app/src/changes/map.rs, crates/stepan_verify_app/src/changes/mod.rs]
    - Карта: нажать «Стало» -> Видно всё, кроме удалённого: новое состояние; добавленные отмечены зелёным, изменённые янтарным  [MapMode::After, status_visible, status_tone, crates/stepan_verify_app/src/changes/map.rs, crates/stepan_verify_app/src/changes/mod.rs]
    - Карта: нажать «Разница» -> Видно всё сразу: добавленное, изменённое, удалённое красным, убранные связи пунктиром, контекст пунктирной рамкой  [MapMode::Diff, render_map_section, crates/stepan_verify_app/src/changes/mod.rs]
    - Карта: нажать «Списком» -> Холст сменяется тремя колонками кода: добавлено, изменено, удалено; повторный клик возвращает холст  [show_list, render_columns, crates/stepan_verify_app/src/changes/mod.rs]
  По итерациям и узлам:
    - Вкладка «Изменения»: выбрать чип «#N» в блоке «Итерации» -> Карта показывает прогон N; новое в этой итерации помечено синей точкой, счётчик «новое в итерации · N» в тулбаре  [render_iterations, fresh, changed_since, crates/stepan_verify_app/src/changes/mod.rs]
    - Карта: нажать карточку функции -> Открывается Панель узла: статус, тип, сигнатура и дифф, связи «вызывают» / «вызывает», риски, проверки  [Panel::Node, render_node_panel, crates/stepan_verify_app/src/changes/mod.rs]
    - Карта: нажать карточку данных в полосе «ДАННЫЕ» -> Открывается Панель данных; подробнее — в фиче «Вкладка «Как устроено»»  [Panel::Dto, render_dto_lane, crates/stepan_verify_app/src/changes/mod.rs]
    - Карта: нажать заголовок кадра -> Открывается Панель группы: что делает группа, сущности по ролям и тесты, которые их проверяют  [Panel::Group, render_group_panel, crates/stepan_verify_app/src/changes/mod.rs]

