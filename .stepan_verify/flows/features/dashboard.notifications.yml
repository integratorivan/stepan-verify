feature: Уведомления «закончил / ждёт подтверждения»
area: Дашборд («Пульт»)
summary: Когда агент закончил или ждёт подтверждения, а ты не смотришь на сессию, приходит тост и уведомление macOS
aliases: [тосты, уведомления, нотификации]

paths:
  Агент закончил в фоне:
    - Любой экран (окно не на этой сессии): Дождаться завершения хода или запроса подтверждения -> Показывается тост / уведомление macOS  [AppView::on_session_event, is_window_active, crates/stepan_verify_app/src/app.rs]
