feature: Скиллы и их использование агентами
area: Скиллы («Связи»)
summary: Пользователь видит, какие скиллы есть, кто их видит и как Claude и Codex вызывали их за последние 30 дней
aliases: [скиллы, связи, использование скиллов]
entries: [crates/stepan_verify_app/src/skills.rs, Page::Skills]

paths:
  Смотреть скиллы:
    - Левый сайдбар: Нажать «Скиллы» -> Открывается список скиллов со счётчиками на вкладках  [SkillsView, Page::Skills, crates/stepan_verify_app/src/skills.rs, crates/stepan_verify_app/src/app.rs]
    - Скиллы: Переключить вкладку «Вызывались» / «Без дела 2 нед» / «Проблемы» и чип агента -> Список фильтруется  [Tab, AgentFilter, crates/stepan_verify_app/src/skills.rs]
