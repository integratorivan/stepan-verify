feature: Что проверить и замечания агенту
area: Изменения («Карта»)
summary: Ревьюер оставляет список проверок; узлы можно добавить «в замечания» и отправить агенту или вернуть с замечанием
aliases: [замечания, вернуть с замечанием, проверки ревьюера]

paths:
  Вернуть агенту замечания:
    - Панель узла: Нажать «в замечания» -> Узел попадает в список замечаний  [Panel::Return, remarks, crates/stepan_verify_app/src/changes/mod.rs]
    - Панель «Вернуть»: Нажать «Отправить агенту» или «Вернуть с замечанием» -> Текст замечаний уходит агенту в сессию  [ChangesView::send_remarks, crates/stepan_verify_app/src/changes/mod.rs]
