[workspace]
resolver = "2"
members = ["crates/*"]
# Plugin state dirs (oh-my-claudecode) land here; not crates.
exclude = ["crates/.omc"]

[workspace.package]
edition = "2021"
version = "0.2.2"

[workspace.dependencies]
gpui-kit = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
stepan_verify_core = { opt-level = 3 }
serde_json = { opt-level = 3 }
memchr = { opt-level = 3 }
